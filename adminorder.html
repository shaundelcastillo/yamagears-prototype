<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yama Gears - Order Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin-order.css">
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="brand">
            <h2>YAMA <span>GEARS</span></h2>
            <small>Admin Panel</small>
        </div>
        <nav class="nav-menu">
            <a href="admin.html" class="nav-item">
                <i class="fa-solid fa-chart-pie"></i> Overview
            </a>
            <a href="adminproduct.html" class="nav-item">
                <i class="fa-solid fa-box"></i> Products
            </a>
            <a href="adminorder.html" class="nav-item active">
                <i class="fa-solid fa-cart-shopping"></i> Orders
            </a>
            <a href="adminsettings.html" class="nav-item">
                <i class="fa-solid fa-gear"></i> Settings
        </nav>
        <div class="sidebar-footer">
            <a href="index.html" class="nav-item logout">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Back to Store
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="topbar">
            <h1>Order Management</h1>
        </header>

        <div class="content-body">
            <!-- Controls Bar -->
            <div class="controls-card">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="order-search" placeholder="Search by Order ID or Customer Name..." onkeyup="filterOrders()">
                </div>
                <div class="filter-box">
                    <select id="status-filter" onchange="filterOrders()" class="form-control">
                        <option value="all">All Statuses</option>
                        <option value="Processing">Processing</option>
                        <option value="In Transit">In Transit</option>
                        <option value="Delivered">Delivered</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="data-card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer Name</th>
                                <th>Date</th>
                                <th>Payment Method</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Order Details Modal -->
    <div id="order-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-order-id">Order Details</h3>
                <span class="close-btn" onclick="closeOrderModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="order-meta">
                    <p><strong>Customer:</strong> <span id="detail-customer"></span></p>
                    <p><strong>Date:</strong> <span id="detail-date"></span></p>
                    <p><strong>Payment Method:</strong> <span id="detail-payment"></span></p>
                    <p><strong>Status:</strong> 
                        <select id="detail-status-select" class="form-control status-select">
                            <option value="Processing">Processing</option>
                            <option value="In Transit">In Transit</option>
                            <option value="Delivered">Delivered</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </p>
                </div>
                
                <hr class="divider">

                <h4>Items Ordered</h4>
                <ul id="detail-items-list" class="items-list">
                    <!-- Dynamic items list -->
                </ul>

                <div class="order-total-bar">
                    <span>Total Amount:</span>
                    <strong id="detail-total-amount">₱0.00</strong>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeOrderModal()">Close</button>
                <button class="btn btn-primary" onclick="saveOrderStatus()">Save Status</button>
            </div>
        </div>
    </div>

    <script src="admin-order.js"></script>
</body>
</html>
